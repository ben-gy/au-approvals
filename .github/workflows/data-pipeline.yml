name: Data Pipeline

on:
  schedule:
    # Source cadence: ABS Building Approvals is published MONTHLY (small-area
    # SA2/SA3 detail lands a few business days after the main release).
    # Monthly cron is the fastest allowed and matches the source. Staggered to
    # the 11th at 05:23 UTC so this repo does not fire with the rest of the fleet.
    - cron: '23 5 11 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm install`, not `npm ci`: mapshaper is the only pipeline dep and its
      # optional native bits trip `npm ci` on the runner. parse.mjs stays
      # dependency-free so the vitest suite never needs this install.
      - run: cd pipeline && npm install
      - run: node pipeline/collect.mjs
      - run: node pipeline/aggregate.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
